# ============================================================================
# 标签画像采集平台 — Nginx 入口（MVP 单机形态）
#
# 职责：
#   1. 统一入口：控制台静态页 /console/*、控制台接口 /api/v1/console/*、开放 API /api/v1/open/*
#   2. 开放 API 反向代理：路径原样透传（HMAC 签名基于编码后 URI 计算，禁止改写路径）
#   3. 批量写入大 body 放行（≤1000 条）与 IP 级粗粒度限速兜底
#   4. 生产环境 TLS 由外层 LB / 证书终止；本配置保留 80 明文，便于内网演示
#   5. 旧前缀 /open/v1/*、/console/api/* 为兼容入口，计划下个主版本移除
# ============================================================================
worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    server_tokens off;

    log_format main '$remote_addr "$request" $status $body_bytes_sent ${request_time}s app_key="$http_x_app_key"';
    access_log /var/log/nginx/access.log main;

    # IP 级限速兜底（租户 / 操作员 / 对象维度的精细频控在应用 access 模块内实现）
    limit_req_zone $binary_remote_addr zone=open_api:10m rate=100r/s;

    upstream tag_platform {
        server tag-platform:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # 根路径跳转控制台
        location = / {
            return 302 /console/index.html;
        }

        # ===== 新前缀（统一体系 /api/v1/{open|console}）=====
        # 开放 API：GET /api/v1/open/tags、POST /api/v1/open/tag-values/write|delete、
        #          GET /api/v1/open/objects/{id}/profile、GET /api/v1/open/operators/{id}/tag-records
        location /api/v1/open/ {
            limit_req zone=open_api burst=200 nodelay;
            client_max_body_size 16m;

            proxy_pass http://tag_platform;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # 控制台接口：/api/v1/console/*
        location /api/v1/console/ {
            client_max_body_size 8m;

            proxy_pass http://tag_platform;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ===== 兼容旧前缀（Deprecated，下个主版本移除）=====
        location /open/v1/ {
            limit_req zone=open_api burst=200 nodelay;
            client_max_body_size 16m;

            proxy_pass http://tag_platform;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # 控制台：静态页（index.html / app.js / style.css）与旧接口前缀 /console/api/*
        location /console/ {
            client_max_body_size 8m;

            proxy_pass http://tag_platform;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 运维探活
        location = /actuator/health {
            proxy_pass http://tag_platform;
            proxy_set_header Host $host;
        }
    }
}

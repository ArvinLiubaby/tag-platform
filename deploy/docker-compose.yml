# ============================================================================
# 标签画像采集平台 — 单机 Docker Compose 编排（MVP 生产形态）
#
# 组件与职责（对应技术方案部署视图）：
#   nginx        统一入口：反向代理 / 静态控制台 / IP 级限速兜底（生产由外层 LB 终止 TLS）
#   tag-platform 模块化单体（Spring Boot 3：access / meta / write / query / audit）
#   mysql:8.0    元数据：租户、凭证、标签字典、幂等记录、待审核队列、Outbox、审计日志
#   redis:7      幂等键 / nonce 防重放 / 频控窗口 / 控制台会话
#   starrocks    all-in-one（FE+BE）：标签最新值宽表（PK 模型收敛）+ 变更流水（永久保留）
#
# 使用：
#   cp .env.example .env        # 修改密码与加密主密钥（生产必改）
#   docker compose up -d --build
#   HOST=localhost PORT=80 ../deploy/smoke-test.sh   # 冒烟（经 Nginx 入口）
# ============================================================================
name: tag-platform

services:

  # ---------------------------------------------------------------- MySQL 8
  mysql:
    image: mysql:8.0
    container_name: tp-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-tp_root_demo}
      MYSQL_DATABASE: tag_platform
      MYSQL_USER: tag_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tag_app_demo}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  # ---------------------------------------------------------------- Redis 7
  redis:
    image: redis:7-alpine
    container_name: tp-redis
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # ------------------------------------------------- StarRocks（all-in-one）
  # 首次启动需 1~3 分钟（FE journal 初始化 + BE 注册）；应用启动后自动执行建表 DDL
  starrocks:
    image: ${STARROCKS_IMAGE:-starrocks/allin1-ubuntu:3.2.6}
    container_name: tp-starrocks
    ports:
      - "${STARROCKS_FE_PORT:-9030}:9030"    # FE MySQL 协议（应用连接）
      - "${STARROCKS_HTTP_PORT:-8030}:8030"  # FE Web UI
    volumes:
      - starrocks-data:/data/deploy/starrocks
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9030'"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 180s
    restart: unless-stopped

  # --------------------------------------------------------- 平台单体服务
  tag-platform:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: tag-platform-server:1.0.0
    container_name: tp-server
    environment:
      TZ: Asia/Shanghai
      # 主库：元数据 / 幂等 / 审核 / 审计（Flyway 启动自动迁移 V1+V2）
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/tag_platform?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: tag_app
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-tag_app_demo}
      # Redis：幂等键 / nonce / 频控 / 控制台会话（kv=redis 为 application.yml 默认）
      SPRING_DATA_REDIS_HOST: redis
      # StarRocks：标签最新值宽表 + 变更流水（store=starrocks 为默认）
      TAG_PLATFORM_STARROCKS_URL: jdbc:mysql://starrocks:9030/tag_platform?useSSL=false&serverTimezone=Asia/Shanghai
      TAG_PLATFORM_STARROCKS_USERNAME: ${STARROCKS_USER:-root}
      TAG_PLATFORM_STARROCKS_PASSWORD: "${STARROCKS_PASSWORD:-}"
      # 凭证 Secret 可逆加密主密钥：生产必须替换为强随机值
      TAG_PLATFORM_CRYPTO_MASTER_KEY: ${TAG_PLATFORM_MASTER_KEY:-change-me-in-prod-0123456789abcdef}
    ports:
      - "${TAG_PLATFORM_PORT:-18080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      starrocks:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------- Nginx 入口
  nginx:
    image: nginx:1.27-alpine
    container_name: tp-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      tag-platform:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  starrocks-data:

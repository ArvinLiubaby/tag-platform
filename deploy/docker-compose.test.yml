# ============================================================================
# 标签画像采集平台 — 测试环境基础设施编排
#
# 与本地环境一致：MySQL / Redis / StarRocks 以容器运行，应用以 java -jar 直跑
# （systemd: tag-platform-test.service，默认 8081 端口）。
#
# 使用：
#   cp .env.test.example .env.test      # 填写口令与主密钥
#   docker compose -f docker-compose.test.yml --env-file .env.test up -d
#
# 端口仅绑定 127.0.0.1，避免测试库直接暴露在网络上。
# ============================================================================
name: tag-platform-test

services:

  # ---------------------------------------------------------------- MySQL 8
  mysql:
    image: mysql:8.0
    container_name: tp-test-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须在 .env.test 中设置}
      MYSQL_DATABASE: tag_platform
      MYSQL_USER: tag_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?必须在 .env.test 中设置}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  # ---------------------------------------------------------------- Redis 7
  redis:
    image: redis:7-alpine
    container_name: tp-test-redis
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # ------------------------------------------------- StarRocks（all-in-one）
  # 首次启动需 1~3 分钟（FE journal 初始化 + BE 注册）；应用启动后自动建表
  starrocks:
    image: ${STARROCKS_IMAGE:-starrocks/allin1-ubuntu:3.2.6}
    container_name: tp-test-starrocks
    ports:
      - "127.0.0.1:${STARROCKS_FE_PORT:-9030}:9030"
      - "127.0.0.1:${STARROCKS_HTTP_PORT:-8030}:8030"
    volumes:
      - starrocks-data:/data/deploy/starrocks
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9030'"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 180s
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  starrocks-data:

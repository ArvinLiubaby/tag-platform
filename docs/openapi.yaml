openapi: 3.0.3
info:
  title: 标签画像采集平台 · 开放 API
  version: 1.0.0
  description: |
    业务系统通过开放 API 在对象（司机 / 车辆 / 车队 / 告警事件）上打标签。契约遵循「只增不删」。

    ## HMAC-SHA256 签名
    每个请求携带四个头：`X-App-Key`、`X-Timestamp`（毫秒，±300 秒偏差）、`X-Nonce`（60 秒内不可重复）、
    `X-Signature`（hex 小写）。待签名字符串（`\n` 连接）：

    ```
    STRING_TO_SIGN = METHOD + "\n" + PATH + "\n" + CANONICAL_QUERY + "\n" + RAW_BODY + "\n" + TIMESTAMP + "\n" + NONCE
    signature = hex(HMAC-SHA256(secret, STRING_TO_SIGN))
    ```

    - `PATH`：不含 query 的**编码后**路径（如 `/api/v1/open/objects/profiles`）
    - `CANONICAL_QUERY`：key 字典序、同 key value 字典序，`k=v` 以 `&` 连接（URL 解码后的原值）
    - `RAW_BODY`：请求体原文（GET 为空串）

    ## 统一响应
    `{ code, message, request_id, data }`；`code=0` 成功。鉴权类错误 HTTP 401/403，频控 429，
    其余业务错误 HTTP 200 携带非 0 code（详见各接口说明）。

    ## 写入语义
    - 批量 ≤1000 条，**整批校验全过才受理**（all-or-nothing）
    - `biz_request_id` 幂等（24h 内重复提交回放首次响应）
    - 写入/作废只追加 `tag_value_history` + Outbox；画像数据源 `tag_value_latest` 由外部写入程序维护，**平台不再直接写入**（受理成功 ≠ 画像立即可查）
    - 敏感标签（`need_value_audit=1`）的流水记为 `pending_audit`，`remark` 必填；平台值审核已停用（3013）
    - 标签写入开关（`writable`）：`false` 的标签不可写入/作废，POST 写入与作废整批拒绝（3012）
    - 频控：IP 100 QPS / 操作员 20 QPS / 同对象同标签 1 QPS（超限 429）
servers:
  - url: http://localhost:8080
    description: 本地 / demo
tags:
  - name: tags
    description: 标签字典
  - name: write
    description: 标签值写入与作废
  - name: query
    description: 画像与打标记录

paths:
  /api/v1/open/tags:
    get:
      tags: [tags]
      summary: 标签字典
      description: 返回当前凭证租户可见的在线标签（公开标签 + 本租户标签）。
      parameters:
        - name: category_code
          in: query
          required: false
          schema: { type: string }
          description: 按类目过滤（如 risk_score）
        - name: object_type
          in: query
          required: false
          schema: { type: string }
          description: 按适用对象过滤（如 driver）；返回绑定该对象类型的标签（含未绑定/不限对象标签需自行区分）
        - name: source_mode
          in: query
          required: false
          schema: { type: string, enum: [manual, statistics, hybrid, algo] }
          description: 按打标来源过滤；`manual` 专供客服系统拉取「需人工打标」标签清单
        - $ref: '#/components/parameters/XAppKey'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XNonce'
        - $ref: '#/components/parameters/XSignature'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          tags:
                            type: array
                            items: { $ref: '#/components/schemas/TagView' }
                          total: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/open/tag-values/write:
    post:
      tags: [write]
      summary: 批量写入标签值
      description: |
        整批受理（≤1000 条）。整批校验全部通过才写入；任一条失败则整批拒绝，
        返回非 0 code（HTTP 200），message 形如「第 N 条校验失败: 原因」，
        data 含 index / object_type / object_id / tag_code / reason。
        受理成功后逐条结果在 `results[].status`：`accepted`（已受理）/ `pending_audit`（敏感标签流水待处理）。
                写入仅追加打标流水，`tag_value_latest` 由外部写入程序维护。
        相同 `biz_request_id` 重复提交回放首次响应。
        标签写入开关（`writable=false`）关闭时该标签整批拒绝（code 3012，message 含「不允许写入」）。
      parameters:
        - $ref: '#/components/parameters/XAppKey'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XNonce'
        - $ref: '#/components/parameters/XSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WriteRequest' }
      responses:
        '200':
          description: OK（业务校验失败亦为 200，携带非 0 code）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WriteResult' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/FrequencyLimited'

  /api/v1/open/tag-values/delete:
    post:
      tags: [write]
      summary: 批量作废标签值
      description: |
        将标签值置为 `revoked`：以该对象+标签最近一条流水为基准追加 `revoked` 流水；结果 `results[].status`：`revoked` / `not_found`。
                作废只写流水，画像变更由外部写入程序同步。
        标签写入开关（`writable=false`）关闭时不可作废，整批拒绝（code 3012）。
      parameters:
        - $ref: '#/components/parameters/XAppKey'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XNonce'
        - $ref: '#/components/parameters/XSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WriteResult' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/FrequencyLimited'

  /api/v1/open/objects/profiles:
    get:
      tags: [query]
      summary: 对象画像（统一入口，单/多对象）
      description: |
        画像查询的唯一入口：一次读取一个或多个对象的当前标签画像；
        object_type / object_id 逗号分隔多值，按位置配对、不做笛卡尔积。
        `include_empty` 默认 false，需要无值占位时显式传 true；`total` 表示对象数（records 条数）。
        `object_type` / `object_id` 均支持逗号分隔多值，按位置配对、不做笛卡尔积：
        单类型多对象可只传 1 个 object_type 配多个 object_id（driver + 123,324）；
        多类型时两者个数必须相同（driver,vehicle + 123,345 = (driver,123)、(vehicle,345)）。
        默认只返回有值标签（排除 revoked 与已过期，含 unit 与 derived）；
        include_empty=true 时按「可见在线标签中适用于该对象的标签」补全 status=none 空占位（占位也带 unit，组合标签无值同样占位）；
        tag_codes 可精确取码，当前值、占位与组合标签都受同一份过滤约束。
        空占位与精确取码已承接原组合画像接口的全部能力。
        重复的 (type,id) 自动去重；单次最多 20 个类型 / 200 个对象；不分页，total = records 条数。
      parameters:
        - name: object_type
          in: query
          required: true
          schema: { type: string, example: "driver,vehicle" }
          description: 对象类型，逗号分隔多值；单类型多对象时只传 1 个即可
        - name: object_id
          in: query
          required: true
          schema: { type: string, example: "DRV85001,VH10086" }
          description: 对象 ID，逗号分隔多值；批量画像必须指定对象
        - name: include_pending
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: include_empty
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: 默认 false（只返回有值标签）；true 时补全 status=none 空占位，占位项同样带 unit
        - name: tag_codes
          in: query
          required: false
          schema: { type: string, example: "risk_level,avg_daily_duration" }
          description: 逗号分隔的标签码，精确取码；当前值、空占位、组合标签都受同一份过滤约束；不传或空串 = 不过滤
        - $ref: '#/components/parameters/XAppKey'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XNonce'
        - $ref: '#/components/parameters/XSignature'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ProfileBatchView' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/open/tag-records:
    get:
      tags: [query]
      summary: 操作员打标记录（推荐入口）
      description: |
        按操作员分页查询打标流水（含审核状态字段），支持对象/标签/时间过滤。
        v1.22.0 起推荐用本接口（operator_id 走 query 参数，签名 PATH 为固定字符串、无动态段编码）；
        旧路径式 /operators/{operatorId}/tag-records 保留兼容，响应结构完全一致。
      parameters:
        - name: operator_id
          in: query
          required: true
          schema: { type: string, example: OP_SERVICE01 }
          description: 操作员 ID（写入时提交的 operator.operator_id）
        - name: object_type
          in: query
          required: false
          schema: { type: string }
        - name: object_id
          in: query
          required: false
          schema: { type: string }
        - name: tag_code
          in: query
          required: false
          schema: { type: string }
        - name: from
          in: query
          required: false
          schema: { type: string, example: '2026-10-01 00:00:00' }
          description: 起始时间（yyyy-MM-dd HH:mm:ss，按 op_time）
        - name: to
          in: query
          required: false
          schema: { type: string, example: '2026-10-31 23:59:59' }
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1 }
        - name: size
          in: query
          required: false
          schema: { type: integer, default: 20 }
        - $ref: '#/components/parameters/XAppKey'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XNonce'
        - $ref: '#/components/parameters/XSignature'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OperatorRecordsView' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/open/operators/{operatorId}/tag-records:
    get:
      deprecated: true
      tags: [query]
      summary: 操作员打标记录（路径式·兼容保留，推荐用 /tag-records）
      description: 按操作员分页查询打标流水（含审核状态字段），支持对象/标签/时间过滤。v1.22.0 起新增 query 式 /api/v1/open/tag-records，本路径保留兼容，响应结构完全一致。
      parameters:
        - name: operatorId
          in: path
          required: true
          schema: { type: string }
          description: 操作员 ID（签名使用编码后的路径）
        - name: object_type
          in: query
          required: false
          schema: { type: string }
        - name: object_id
          in: query
          required: false
          schema: { type: string }
        - name: tag_code
          in: query
          required: false
          schema: { type: string }
        - name: from
          in: query
          required: false
          schema: { type: string, example: '2026-10-01 00:00:00' }
          description: 起始时间（yyyy-MM-dd HH:mm:ss，按 op_time）
        - name: to
          in: query
          required: false
          schema: { type: string, example: '2026-10-31 23:59:59' }
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1 }
        - name: size
          in: query
          required: false
          schema: { type: integer, default: 20 }
        - $ref: '#/components/parameters/XAppKey'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XNonce'
        - $ref: '#/components/parameters/XSignature'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OperatorRecordsView' }
        '401':
          $ref: '#/components/responses/Unauthorized'

components:

  parameters:
    XAppKey:
      name: X-App-Key
      in: header
      required: true
      schema: { type: string }
    XTimestamp:
      name: X-Timestamp
      in: header
      required: true
      schema: { type: string }
      description: 毫秒时间戳（±300 秒）
    XNonce:
      name: X-Nonce
      in: header
      required: true
      schema: { type: string }
      description: 一次性随机串（60 秒内不可重复）
    XSignature:
      name: X-Signature
      in: header
      required: true
      schema: { type: string }
      description: HMAC-SHA256 十六进制小写签名

  responses:
    Unauthorized:
      description: 鉴权失败（1001~1008）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BaseResponse' }
    FrequencyLimited:
      description: 频控超限（3005 操作员 / 3006 对象标签 / 3007 IP）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BaseResponse' }

  schemas:

    BaseResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: integer
          description: |
            0 成功；1xxx 鉴权（1003 签名失败 / 1004 时间戳超限 / 1005 Nonce 重放 /
            1006 租户不匹配 / 1007 租户停用 / 1008 凭证停用）；
            2xxx 参数（2001 缺参 / 2002 校验失败 / 2003 批量超限）；
            3xxx 业务（3001 标签不存在 / 3002 未上线 / 3003 对象类型未注册 / 3004 处理中 /
            3005~3007 频控 429 / 3008 remark 必填 / 3009 值不存在 / 3010 非待审核态 /
            3011 标签不适用于该对象类型 / 3012 标签不允许写入（写入开关已关闭） /
                        3013 标签值审核已停用）；
            5xxx 系统（5001 内部错误 / 5002 存储失败）
        message: { type: string }
        request_id: { type: string }
        data: { nullable: true, description: 业务数据（错误时为 null） }

    TagView:
      type: object
      properties:
        tag_code: { type: string }
        tag_name: { type: string }
        category_code: { type: string }
        dim1_code:
          type: string
          nullable: true
          description: 一级维度编码（tag_category 根节点，如 personality / driving_ops / baseline）
        dim1_name:
          type: string
          nullable: true
          description: 一级维度中文名称（实时解析自 tag_category，如 性格特征 / 运营模式；维度被删除时为 null）
        dim2_code:
          type: string
          nullable: true
          description: 二级维度编码（与 category_code 同值，如 personality_trait）
        dim2_name:
          type: string
          nullable: true
          description: 二级维度中文名称（实时解析自 tag_category；维度被删除时为 null）
        priority:
          type: integer
          nullable: true
          description: 标签优先级（来源清单「人工打标签标签」列，数值越小越靠前；null = 非人工打标标签）
        dim1_priority:
          type: integer
          nullable: true
          description: 所属一级维度的展示优先级（与 ext.dim1_priority 同源，数值型便捷字段）；未配置为 null
        value_type: { type: string, enum: [boolean, enum, number, string, date] }
        unit:
          type: string
          nullable: true
          description: 数值型统计指标的计量单位（如 小时 / 天 / 次 / 公里）；文本、布尔、枚举类为 null
        value_range:
          type: string
          nullable: true
          description: 'JSON 文本，如 {"enum":["low","medium","high"]}'
        value_multiple:
          type: boolean
          description: 仅 enum 生效；true = 多选，tag_value 用英文逗号分隔多个枚举值（如 公共道路,港口）
        options:
          type: array
          items: { type: string }
          description: enum 标签的允许值列表（非 enum 为空数组），供接入方渲染单选/多选控件
        tag_type: { type: string, enum: [rule, fact, algo] }
        object_type:
          type: string
          nullable: true
          description: 适用对象类型，逗号分隔（如 driver,vehicle）；null = 不限对象
        source_mode:
          type: string
          nullable: true
          enum: [manual, statistics, hybrid, algo]
          description: 打标来源：manual 客服手工 / statistics 数据统计 / hybrid 手工+统计 / algo 算法
        need_value_audit: { type: boolean }
        writable:
          type: boolean
          description: 写入开关：false = 禁止写入，POST 写入/作废该标签整批拒绝（code 3012）
        value_ttl_days: { type: integer, description: 0 表示不过期 }
        sensitivity: { type: string, enum: [L1, L2, L3, L4] }
        status: { type: string, enum: [online, offline, reviewing, rejected] }
        version:
          type: integer
          description: 标签定义版本号（每次修改定义 +1，可用于对接方判断本地缓存是否过期）
        derived: { type: boolean, description: 是否组合标签（查询期计算，不可写入） }
        updated_at: { type: string, format: date-time }
        ext:
          type: object
          additionalProperties: { type: string }
          description: |
            租户级标签扩展信息（key→value，值统一为字符串）。未单独配置时返回属性默认值，未配置且无默认值的属性不出现。
            内置 key：
              show_screen   标签展示屏幕：主 / 副（默认 副）
              hidden        是否隐藏：true / false（默认 false）
              script        标签话术（文本，可能较长）
              risk_priority 标签风控展示优先级（整数，越小越靠前）
              dim1_priority 所属一级维度的展示优先级（整数，随维度配置；与顶层数值字段 dim1_priority 同源）
            租户可在控制台增减自定义属性，接入方应忽略不认识的 key。

    Operator:
      type: object
      required: [operator_id, operator_type]
      properties:
        operator_id: { type: string }
        operator_name: { type: string }
        operator_type: { type: string, enum: [human, system, algo] }
        operator_org: { type: string }

    WriteRequest:
      type: object
      required: [biz_request_id, items]
      properties:
        biz_request_id: { type: string, maxLength: 96, description: 幂等键（接入方业务请求 ID，24h 去重） }
        task_id:
          type: integer
          format: int64
          nullable: true
          description: |
            关联打标任务 ID。两种用法对应两条通道：
            不传 = 通用写入通道：可在任意时间推送标签值，不受任务状态与任务进度约束（任务进行中、已验收、已取消都照常受理），只追加流水与事件，不影响任何任务的进度与对象项状态。
            传入 = 任务作业通道：校验任务状态（published / in_progress / reviewing，已验收拒绝写入），标签写齐后自动推进任务项。
            支持分批：单次只需推任务中的部分标签（甚至 1 个），对象项先置 in_progress，必填标签全部写完才自动完成。
            全部对象模式：任务 all_objects=true 时不校验对象是否已在任务快照中，写入的新对象自动纳入任务项并参与进度统计。
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: '#/components/schemas/WriteItem' }

    WriteItem:
      type: object
      required: [object_type, object_id, tag_code, tag_value, operator]
      properties:
        object_type: { type: string, example: driver }
        object_id: { type: string, example: DRV00001 }
        object_name:
          type: string
          nullable: true
          maxLength: 256
          description: 对象名称（姓名 / 车牌号 / 车队名等），仅用于展示与流水追溯；不参与对象主键、幂等判断与频控
          example: 张伟
        tag_code: { type: string, example: driving_risk_attitude }
        tag_value: { type: string, maxLength: 2048, description: '按标签 value_type 传字符串。enum 单选传一个枚举值；多选（value_multiple=true）传英文逗号分隔的多个枚举值，如 公共道路,港口' }
        biz_time: { type: string, nullable: true, example: '2026-10-14 10:00:00' }
        operate_time: { type: string, nullable: true, description: 操作员操作时间 }
        operator: { $ref: '#/components/schemas/Operator' }
        source: { type: string, nullable: true, description: 来源标识（如客服工作台） }
        confidence: { type: string, maxLength: 10, enum: ["高", "中", "低"], nullable: true, description: 置信度：高/中/低（算法标签使用） }
        remark: { type: string, nullable: true, description: 敏感标签必填打标理由 }
        evidence_url: { type: string, nullable: true }
        ext_json: { type: string, nullable: true, description: 扩展字段（JSON 文本） }

    DeleteRequest:
      type: object
      required: [biz_request_id, items]
      properties:
        biz_request_id: { type: string, description: 幂等键 }
        items:
          type: array
          maxItems: 1000
          items:
            type: object
            required: [object_type, object_id, tag_code]
            properties:
              object_type: { type: string }
              object_id: { type: string }
              tag_code: { type: string }
              operator: { $ref: '#/components/schemas/Operator' }
              remark: { type: string, nullable: true }

    WriteResult:
      type: object
      properties:
        biz_request_id: { type: string }
        total: { type: integer }
        accepted: { type: integer, description: 已受理（流水 effective，不代表画像已可查） }
        pending_audit: { type: integer, description: 已受理的敏感标签（流水 pending_audit） }
        results:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              object_type: { type: string }
              object_id: { type: string }
              tag_code: { type: string }
              status:
                type: string
                enum: [accepted, pending_audit, rejected, revoked, not_found]
                description: 写入返回 accepted/pending_audit；作废返回 revoked/not_found；rejected 为预留状态（当前版本整批校验失败不产生）
              message: { type: string, nullable: true, description: 敏感受理提示或拒绝原因（status=rejected 时） }

    TagItem:
      type: object
      description: 画像标签元素（仅生效值；include_pending=true 时含 pending_audit；status=none 为无值占位）
      properties:
        tag_code: { type: string }
        tag_name: { type: string }
        dim1_code:
          type: string
          nullable: true
          description: 一级维度编码（tag_category 根节点）；组合标签与未配置维度的标签为 null
        dim1_name:
          type: string
          nullable: true
          description: 一级维度中文名称（实时解析自维度字典）
        dim2_code:
          type: string
          nullable: true
          description: 二级维度编码（与 category_code 同值）
        dim2_name:
          type: string
          nullable: true
          description: 二级维度中文名称（实时解析自维度字典）
        priority:
          type: integer
          nullable: true
          description: 标签优先级（维度内展示顺序，越小越靠前；null = 非人工打标标签）
        dim1_priority:
          type: integer
          nullable: true
          description: 所属一级维度的展示优先级（越小维度越靠前）；未配置为 null
        tag_value: { type: string, nullable: true, description: null = 无当前值（status=none） }
        value_type: { type: string }
        unit:
          type: string
          nullable: true
          description: 计量单位（数值型统计指标如 小时 / 天 / 次 / 公里）；文本、布尔、枚举类为 null；占位项（status=none）同样带单位
        status: { type: string, enum: [effective, pending_audit, none] }
        source_mode: { type: string, nullable: true, enum: [manual, statistics, hybrid, algo], description: 标签打标来源类型（字典字段） }
        need_value_audit: { type: boolean, description: true = 敏感标签，写入后进值审核 }
        biz_time: { type: string, nullable: true }
        operate_time: { type: string, nullable: true }
        expire_time: { type: string, nullable: true }
        operator_id: { type: string, nullable: true }
        operator_name: { type: string, nullable: true }
        operator_type: { type: string, nullable: true }
        operator_org: { type: string, nullable: true }
        source: { type: string, nullable: true }
        confidence: { type: string, maxLength: 10, enum: ["高", "中", "低"], nullable: true, description: 置信度：高/中/低（算法标签使用） }
        remark: { type: string, nullable: true }
        evidence_url: { type: string, nullable: true }

    ProfileView:
      type: object
      properties:
        tenant_id: { type: string }
        object_type: { type: string }
        object_id: { type: string }
        tags:
          type: array
          items: { $ref: '#/components/schemas/TagItem' }

    ProfileBatchView:
      type: object
      description: 对象画像唯一入口的响应；records 中每个元素与 ProfileView 结构完全一致，顺序与传入对象一致；include_empty=true 时 tags 含 status=none 占位
      properties:
        tenant_id: { type: string }
        total: { type: integer, description: 去重后的对象数 = records 条数；本接口不分页 }
        records:
          type: array
          items: { $ref: '#/components/schemas/ProfileView' }

    TagValueFull:
      type: object
      description: 打标流水记录（含审核字段）
      properties:
        tenant_id: { type: string }
        object_type: { type: string }
        object_id: { type: string }
        tag_code: { type: string }
        tag_value: { type: string }
        value_type: { type: string }
        status: { type: string, enum: [effective, pending_audit, expired, revoked] }
        biz_time: { type: string, nullable: true }
        operate_time: { type: string, nullable: true }
        expire_time: { type: string, nullable: true }
        operator_id: { type: string, nullable: true }
        operator_name: { type: string, nullable: true }
        operator_type: { type: string, nullable: true }
        operator_org: { type: string, nullable: true }
        source: { type: string, nullable: true }
        confidence: { type: string, maxLength: 10, enum: ["高", "中", "低"], nullable: true, description: 置信度：高/中/低（算法标签使用） }
        remark: { type: string, nullable: true }
        evidence_url: { type: string, nullable: true }
        audit_by: { type: string, nullable: true }
        audit_time: { type: string, nullable: true }
        audit_remark: { type: string, nullable: true }
        request_id: { type: string, description: 写入请求 request_id（全链路追踪） }
        op_time: { type: string, description: 入库时间 }
        ver: { type: integer, format: int64 }
        ext_json: { type: string, nullable: true }

    OperatorRecordsView:
      type: object
      properties:
        operator_id: { type: string }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer, format: int64 }
        records:
          type: array
          items: { $ref: '#/components/schemas/TagValueFull' }
        units:
          type: object
          additionalProperties: { type: string }
          description: 标签码 → 计量单位映射，仅含本页出现且配置了单位的标签；流水按追加式存储，不在每条记录里冗余单位
